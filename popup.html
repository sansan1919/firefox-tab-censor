<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Censor</title>
    <style>
      :root {
        --bg: #f5f7ff;
        --panel: #ffffff;
        --primary: #315efb;
        --primary-dark: #2447d6;
        --text: #1a1d29;
        --muted: #697386;
        --shadow: rgba(49, 94, 251, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        width: 220px;
        padding: 16px;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, #eef2ff 100%);
        color: var(--text);
      }

      .card {
        background: var(--panel);
        border-radius: 14px;
        padding: 14px 12px 12px;
        box-shadow: 0 10px 24px var(--shadow);
      }

      h3 {
        margin: 0 0 8px;
        font-size: 1.1rem;
        text-align: center;
      }

      p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        line-height: 1.5;
      }

      button {
        width: 100%;
        margin-top: 14px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        padding: 10px 12px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
      }

      button:active {
        transform: translateY(1px);
      }

      button.is-active {
        background: #1e9d68;
      }

      button.is-active:hover {
        background: #167c52;
      }

      #statusText {
        margin-top: 10px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Tab Censor</h3>
      <p>Protect your browsing privacy by masking tab titles.</p>
      <button id="toggleBtn" type="button">Turn Censor On</button>
      <p id="statusText">Privacy mode is off.</p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
